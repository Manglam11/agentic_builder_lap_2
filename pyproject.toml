[project]
name = "agentic-track"
version = "0.1.0"
description = "Lap 2 — Agentic Builder track (practice + capstone)"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.7",
    "google-genai>=2.18.0",
    "groq>=1.6.0",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_track"]